name: Backend CI

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths: ["backend/**", "supabase/migrations/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "supabase/migrations/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  gateway:
    name: Go Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/gateway/go.mod
          cache: false
      - run: go vet ./...
        working-directory: backend/gateway
      - run: go test -race ./...
        working-directory: backend/gateway

  business:
    name: Spring Boot Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/business/pom.xml
      - run: mvn -B -ntp test
        working-directory: backend/business

  containers:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [gateway, business]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
        working-directory: backend
      - run: docker compose --env-file .env.example build
        working-directory: backend
